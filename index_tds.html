*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f7f8;

button,input{font:inherit}

header{
  position:sticky;
  top:0;
  z-index:20;
  color:#fff;
  background:linear-gradient(135deg,#087f8c,#164a67);
  box-shadow:0 3px 14px rgba(0,0,0,.18)
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:16px 14px
}

header h1{
  margin:0;
  font-size:21px
}

header p{
  margin:5px 0 0;
  font-size:12px;
  opacity:.86
}

main{
  max-width:1100px;
  margin:auto;
  padding:18px 14px 70px
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin:12px 0
}

.area-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-bottom:18px
}

.area-button{
  border:0;
  background:#fff;
  border-radius:16px;
  padding:11px 6px;
  min-height:78px;
  font-size:11px;
  font-weight:800;
  color:#26343d;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  cursor:pointer
}

.area-button:active{
  transform:scale(.97)
}

.area-button.active{
  background:#087f8c;
  color:#fff;
  box-shadow:0 5px 15px rgba(8,127,140,.25)
}

.area-icon{
  display:block;
  font-size:24px;
  margin-bottom:5px
}

.search-box{
  margin:4px 0 20px
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  background:#fff;
  border-radius:14px;
  padding:14px 15px;
  font-size:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.07)
}

.card-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px
}

.card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  min-width:0;
  cursor:pointer
}

.card:active{
  transform:scale(.985)
}

.image-wrap{
  width:100%;
  aspect-ratio:16/10;
  background:linear-gradient(135deg,#dfecef,#cbd9de);
  overflow:hidden
}

.facility-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.no-image{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  color:#72838c
}

.card-content{
  padding:11px
}

.card-type{
  font-size:10px;
  color:#77838a;
  margin-bottom:4px
}

.card h3{
  margin:0 0 6px;
  font-size:14px;
  line-height:1.35
}

.card-area{
  display:inline-block;
  padding:3px 7px;
  border-radius:20px;
  background:#eef3f4;
  color:#53636b;
  font-size:9px
}

.card-description{
  margin-top:8px;
  font-size:10px;
  line-height:1.5;
  color:#68757c
}

.status{
  margin-top:7px;
  font-size:10px;
  line-height:1.4;
  color:#c25416;
  font-weight:800
}

.detail-button{
  display:block;
  margin-top:9px;
  padding:9px 5px;
  text-align:center;
  text-decoration:none;
  color:#fff;
  background:#087f8c;
  border-radius:9px;
  font-size:10px;
  font-weight:800
}

.selected-box{
  background:#fff;
  border-radius:17px;
  padding:15px;
  margin:22px 0;
  border-left:5px solid #087f8c;
  box-shadow:0 3px 12px rgba(0,0,0,.08)
}

.selected-label{
  font-size:11px;
  color:#78858b;
  margin-bottom:5px
}

.selected-name{
  font-size:18px;
  font-weight:800
}

.result-section{
  margin-top:27px
}

.result-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:17px;
  font-weight:800;
  margin-bottom:10px
}

.result-count{
  font-size:11px;
  color:#888;
  font-weight:400
}

.empty{
  grid-column:1/-1;
  background:#fff;
  padding:20px;
  border-radius:14px;
  text-align:center;
  color:#888;
  font-size:12px
}

.note{
  background:#eaf5f6;
  border-radius:14px;
  padding:11px 13px;
  font-size:11px;
  line-height:1.6;
  color:#42606a;
  margin:0 0 18px
}

@media(min-width:700px){
  .area-grid{
    grid-template-columns:repeat(4,1fr)
  }

  .card-list{
    grid-template-columns:repeat(3,minmax(0,1fr))
  }
}

@media(max-width:360px){
  .card h3{font-size:13px}
  .card-description{font-size:9px}
}
</style>

/* =========================
   UI
========================= */

const areaIconMap =
Object.fromEntries(
  areas.map(a => [a.name,a.icon])
);

let selectedArea =
"メディテレーニアンハーバー";

let selectedAttraction = null;

const areaButtons =
document.getElementById("areaButtons");


areas.forEach(area => {

  const b =
  document.createElement("button");

  b.className =
  "area-button";

  b.innerHTML =
  `<span class="area-icon">
    ${area.icon}
  </span>
  ${area.name}`;

  b.onclick = () => {

    document
      .querySelectorAll(".area-button")
      .forEach(x =>
        x.classList.remove("active")
      );

    b.classList.add("active");

    selectedArea =
    area.name;

    selectedAttraction =
    null;

    document
      .getElementById("searchInput")
      .value = "";

    document
      .getElementById("selectedArea")
      .style.display = "none";

    document
      .getElementById("nearbyArea")
      .style.display = "none";

    renderAttractions();

  };

  areaButtons.appendChild(b);

});


areaButtons.firstElementChild
  .classList.add("active");


document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderAttractions
  );


/* =========================
   カード
========================= */

function imageHTML(item){

  if(!item.image){

    let icon = "🎢";

    if(item.type.includes("ショップ"))
      icon = "🛍️";

    if(item.type.includes("フード"))
      icon = "🍴";

    if(item.type.includes("フォト"))
      icon = "📸";

    return `
      <div class="no-image">
        ${icon}
      </div>
    `;
  }

  return `
    <img
      class="facility-image"
      src="${item.image}"
      alt="${item.name}"
      loading="lazy"
      decoding="async"
    >
  `;
}


function createCard(item){

  const card =
  document.createElement("div");

  card.className =
  "card";

  card.innerHTML = `

    <div class="image-wrap">
      ${imageHTML(item)}
    </div>

    <div class="card-content">

      <div class="card-type">
        ${item.type}
      </div>

      <h3>
        ${item.name}
      </h3>

      <div class="card-area">
        ${areaIconMap[item.area] || ""}
        ${item.area}
      </div>

      <div class="card-description">
        ${item.description || ""}
      </div>

      ${
        item.status
        ?
        `<div class="status">
          ⚠️ ${item.status}
        </div>`
        :
        ""
      }

      <a
        class="detail-button"
        href="${item.url}"
        target="_blank"
        rel="noopener noreferrer"
      >
        公式詳細を見る ↗
      </a>

    </div>
  `;

  return card;
}


/* =========================
   アトラクション表示
========================= */

function renderAttractions(){

  const list =
  document.getElementById(
    "attractionList"
  );

  list.innerHTML = "";

  const keyword =
  document
    .getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  const filtered =
  attractions.filter(x =>

    x.area === selectedArea &&

    (
      !keyword ||
      x.name
        .toLowerCase()
        .includes(keyword)
    )

  );


  if(!filtered.length){

    list.innerHTML = `
      <div class="empty">
        該当するアトラクションがありません。
      </div>
    `;

    return;
  }


  filtered.forEach(item => {

    const card =
    createCard(item);

    card.onclick = e => {

      if(
        e.target.closest(
          ".detail-button"
        )
      ) return;

      selectAttraction(item);

    };

    list.appendChild(card);

  });

}


/* =========================
   アトラクション選択
========================= */

function selectAttraction(item){

  selectedAttraction =
  item;

  const selected =
  document.getElementById(
    "selectedArea"
  );

  selected.style.display =
  "block";

  selected.innerHTML = `

    <div class="selected-box">

      <div class="selected-label">
        📍 選択中のアトラクション
      </div>

      <div class="selected-name">
        ${item.name}
      </div>

    </div>
  `;

  renderNearby();

  setTimeout(() => {

    selected.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  },40);

}


/* =========================
   周辺施設
========================= */

function renderNearby(){

  if(!selectedAttraction)
    return;

  const nearby =
  document.getElementById(
    "nearbyArea"
  );

  nearby.style.display =
  "block";

  nearby.innerHTML = "";

  const area =
  selectedAttraction.area;

  const lists = [

    [
      "🎢 近くのアトラクション",
      attractions.filter(
        x =>
          x.area === area &&
          x.name !==
          selectedAttraction.name
      )
    ],

    [
      "🍴 近くのフード",
      restaurants.filter(
        x => x.area === area
      )
    ],

    [
      "🛍️ 近くのショップ",
      shops.filter(
        x => x.area === area
      )
    ],

    [
      "📸 フォトスポット",
      photos.filter(
        x => x.area === area
      )
    ]

  ];


  lists.forEach(
    ([title,items]) =>
      addSection(
        nearby,
        title,
        items
      )
  );

}


/* =========================
   セクション追加
========================= */

function addSection(
  parent,
  title,
  items
){

  const section =
  document.createElement(
    "section"
  );

  section.className =
  "result-section";

  section.innerHTML = `

    <div class="result-title">

      <span>
        ${title}
      </span>

      <span class="result-count">
        ${items.length}件
      </span>

    </div>
  `;


  const list =
  document.createElement(
    "div"
  );

  list.className =
  "card-list";


  if(!items.length){

    list.innerHTML = `
      <div class="empty">
        このエリアでは登録されている施設がありません。
      </div>
    `;

  }


  items.forEach(
    item =>
      list.appendChild(
        createCard(item)
      )
  );


  section.appendChild(list);

  parent.appendChild(section);

}


renderAttractions();
