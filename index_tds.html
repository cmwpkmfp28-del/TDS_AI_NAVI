function imageFrom(t){t=t.replace(/&amp;/g,"&").replace(/\\u0026/g,"&");let m=t.match(/イメージ\s*1[^\n\r]{0,500}?(https:\/\/media1\.tokyodisneyresort\.jp\/[^\s)"'<>]+)/i);if(m)return m[1].replace(/[),.;]+$/g,"");let a=t.match(/https:\/\/media1\.tokyodisneyresort\.jp\/[^\s)"'<>]+/gi)||[];return (a.find(u=>/main_visual|main/i.test(u))||a[0]||"").replace(/[),.;]+$/g,"")}
async function getImage(x){if(x.type==="photo")return null;if(cache.has(x.name))return cache.get(x.name);try{let t=await jina(LIST[x.type]);let line=t.split("\n").find(s=>s.includes(x.name));if(!line)return null;let m=line.match(/https:\/\/www\.tokyodisneyresort\.jp\/tds\/(?:attraction|restaurant|shop)\/detail\/[^)\s]+/);if(!m)return null;let d=await jina(m[0]);let u=imageFrom(d);if(u)cache.set(x.name,u);return u}catch(e){return null}}
function nearby(){let b=DATA.find(x=>x.id==baseId);if(!b)return[];return DATA.filter(x=>x.id!==b.id).map(x=>({...x,m:dist(b,x)})).filter(x=>x.m<=390).filter(x=>filter==="all"||x.type===filter).filter(x=>(x.name+x.area).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>a.m-b.m)}
function render(){let b=DATA.find(x=>x.id==baseId);if(!b){grid.innerHTML='<div class="empty">上の施設を選んでください。</div>';return}let a=nearby();document.getElementById("baseStatus").textContent=`基準：${b.name}｜${b.area}`;document.getElementById("status").textContent=`徒歩約5分圏内：${a.length}件`;grid.innerHTML=a.length?a.map(x=>`<article class="card" data-id="${x.id}"><div class="pic">画像読み込み中…</div><div class="body"><div class="name">${x.name}</div><div class="area">${x.area} · ${LABEL[x.type]}</div><div class="distance">徒歩 約${walk(x.m)}分</div></div></article>`).join(""):'<div class="empty">徒歩5分圏内に該当する施設がありません。</div>';grid.querySelectorAll(".card").forEach(c=>{let x=DATA.find(y=>y.id==c.dataset.id);c.onclick=()=>open(x);getImage(x).then(u=>{if(u)c.querySelector(".pic").innerHTML=`<img src="${u}" alt="${x.name}">`})})}
async function open(x){let b=DATA.find(y=>y.id==baseId);detail.classList.add("show");document.getElementById("dtype").textContent=LABEL[x.type];document.getElementById("dname").textContent=x.name;document.getElementById("darea").textContent=x.area;document.getElementById("ddist").textContent=b?`基準施設から徒歩 約${walk(dist(b,x))}分`:"";document.getElementById("hero").textContent="画像を読み込み中…";document.getElementById("actions").innerHTML=x.type==="photo"?"":'<a target="_blank" href="https://www.tokyodisneyresort.jp/tds/">東京ディズニーシー公式サイト</a>';let u=await getImage(x);if(u)document.getElementById("hero").innerHTML=`<img src="${u}" alt="${x.name}">`;else document.getElementById("hero").textContent="公式画像を取得できませんでした"}
document.getElementById("back").onclick=()=>detail.classList.remove("show");base.onchange=e=>{baseId=e.target.value;render()};document.getElementById("search").oninput=e=>{query=e.target.value;render()};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.f;render()});render();
</script></body></html>
